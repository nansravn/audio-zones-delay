[project]
name = "audio-zones-delay"
version = "0.1.0"
description = "Measure the timing offset between two audio zones of a home theater"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3", "scipy>=1.16"]

[project.scripts]
azd = "audio_zones_delay.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
